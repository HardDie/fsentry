name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Race detector needs CGO; Windows runners are unreliable for -race.
      - name: Unit tests (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - name: Unit tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

      - name: Integration tests
        run: go test -tags=integration -count=1 ./...

  check:
    name: Vet, fmt, tidy, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            echo "run: gofmt -w on the files above"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: examples
        run: make examples

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
